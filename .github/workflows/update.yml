on:
  schedule:
    - cron: "0 5 * * *"

  workflow_dispatch:

  push:
    paths:
      - "python/**"
      - ".github/workflows/update.yml"

jobs:
  update:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      # ========================================================
      # CHECKOUT REPOSITORY
      # ========================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ========================================================
      # SET UP PYTHON
      # ========================================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ========================================================
      # INSTALL DEPENDENCIES
      # ========================================================

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      # ========================================================
      # UPDATE COUNTDOWN + LAYOUT
      # ========================================================

      - name: Update Countdown OS
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          DATABASE_ID: ${{ secrets.DATABASE_ID }}
          DATA_SOURCE_ID: ${{ secrets.DATA_SOURCE_ID }}
        run: |
          python python/update.py

      # ========================================================
      # CHECK GENERATED JSON
      # ========================================================

      - name: Check generated JSON
        run: |

          echo "=============================================="
          echo "          COUNTDOWN OS — OUTPUT"
          echo "=============================================="

          echo ""
          echo "===== OUTPUT FILES ====="
          ls -la output/

          echo ""
          echo "===== COUNTDOWN JSON ====="

          if [ -f output/countdown.json ]; then
            cat output/countdown.json
          else
            echo "❌ countdown.json NOT FOUND"
            exit 1
          fi

          echo ""
          echo "===== LAYOUT JSON ====="

          if [ -f output/layout.json ]; then
            cat output/layout.json
          else
            echo "❌ layout.json NOT FOUND"
            exit 1
          fi

          echo ""
          echo "===== GIT STATUS ====="
          git status

      # ========================================================
      # COMMIT JSON FILES
      # ========================================================

      - name: Commit generated JSON
        run: |

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Add both generated contracts
          git add output/countdown.json
          git add output/layout.json

          echo "=============================================="
          echo "       GIT STATUS AFTER ADD"
          echo "=============================================="

          git status

          # Check whether anything changed
          if git diff --cached --quiet; then

            echo ""
            echo "No changes to commit."

          else

            echo ""
            echo "Changes detected."

            git commit -m "Update Countdown OS data"

            echo ""
            echo "===== SYNC WITH REMOTE ====="

            git pull --rebase origin main

            echo ""
            echo "===== PUSH UPDATE ====="

            git push

          fi