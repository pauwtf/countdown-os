name: Update Countdown

on:
  schedule:
    - cron: "0 5 * * *"

  workflow_dispatch:

  push:
    paths:
      - "python/**"
      - ".github/workflows/update.yml"

jobs:
  update:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      # ========================================================
      # CHECKOUT REPOSITORY
      # ========================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ========================================================
      # SET UP PYTHON
      # ========================================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ========================================================
      # INSTALL DEPENDENCIES
      # ========================================================

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      # ========================================================
      # UPDATE COUNTDOWN
      # ========================================================

      - name: Update countdown
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          DATABASE_ID: ${{ secrets.DATABASE_ID }}
          DATA_SOURCE_ID: ${{ secrets.DATA_SOURCE_ID }}
        run: |
          python python/update.py

      # ========================================================
      # CHECK GENERATED JSON
      # ========================================================

      - name: Check generated JSON
        run: |
          echo "===== OUTPUT FILES ====="
          ls -la output/

          echo ""
          echo "===== COUNTDOWN JSON ====="
          cat output/countdown.json

          echo ""
          echo "===== GIT STATUS ====="
          git status

      # ========================================================
      # COMMIT COUNTDOWN JSON
      # ========================================================

      - name: Commit countdown JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add output/countdown.json

          echo "===== GIT STATUS AFTER ADD ====="
          git status

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update countdown"

            echo "===== SYNC WITH REMOTE ====="
            git pull --rebase origin main

            echo "===== PUSH UPDATE ====="
            git push
          fi