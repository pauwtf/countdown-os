name: Layout Engine Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:

      # ========================================================
      # CHECKOUT REPOSITORY
      # ========================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ========================================================
      # SET UP PYTHON
      # ========================================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # ========================================================
      # LAYOUT ENGINE TEST
      # ========================================================

      - name: Run Layout Engine Test
        run: |
          python python/layout_test.py


      # ========================================================
      # PROGRESS BOUNDARY TEST
      # ========================================================

      - name: Run Progress Boundary Test
        run: |
          python python/layout_progress_test.py


      # ========================================================
      # LAYOUT CONTRACT TEST
      # ========================================================

      - name: Run Layout Contract Test
        run: |
          python python/layout_contract_test.py


      # ========================================================
      # KWGT COORDINATE ADAPTER TEST
      # ========================================================

      - name: Run KWGT Coordinate Adapter Test
        run: |
          python python/kwgt_coordinate_adapter_test.py


      # ========================================================
      # LAYOUT OUTPUT TEST
      # ========================================================

      - name: Run Layout Output Test
        run: |
          python python/layout_output_test.py

      # ========================================================
      # LAYOUT JSON CONTRACT TEST
      # ========================================================

      - name: Run Layout JSON Contract Test
        run: |
          python python/layout_json_contract_test.py
      # ========================================================
      # SUCCESS
      # ========================================================

      - name: All Layout Tests Passed
        run: |
          echo "=============================================="
          echo "     🟢 COUNTDOWN OS — LAYOUT TESTS PASSED"
          echo "=============================================="
          echo ""
          echo "✓ Layout Engine"
          echo "✓ Progress Boundaries"
          echo "✓ Layout Contract"
          echo "✓ KWGT Coordinate Adapter"
          echo "✓ Layout Output"
          echo ""
          echo "Layout pipeline validated successfully."